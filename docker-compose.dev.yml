version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: geoflood-postgres-dev
    environment:
      POSTGRES_USER: geoflood
      POSTGRES_PASSWORD: geoflood_dev
      POSTGRES_DB: geoflood
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoflood"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: geoflood-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  minio:
    image: minio/minio:latest
    container_name: geoflood-minio-dev
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: minio server /data --console-address ":9001"

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: geoflood-api-dev
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://geoflood:geoflood_dev@postgres:5432/geoflood
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: FTDTRDCFF666FTCTCF6CCCV6TF6
      JWT_EXPIRATION: 24h
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: npm run start:dev

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: geoflood-worker-dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://geoflood:geoflood_dev@postgres:5432/geoflood
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: FTDTRDCFF666FTCTCF6CCCV6TF6
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: npm run start:dev -- --entryFile worker

  python-engine:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: geoflood-python-dev
    environment:
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    volumes:
      - ./python:/app

volumes:
  postgres_data:
  redis_data:
  minio_data:
