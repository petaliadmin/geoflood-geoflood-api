version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: geoflood-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geoflood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geoflood_dev}
      POSTGRES_DB: ${POSTGRES_DB:-geoflood}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geoflood}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: geoflood-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: always

  minio:
    image: minio/minio:latest
    container_name: geoflood-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: minio server /data --console-address ":9001"
    restart: always

  api:
    image: ${DOCKERHUB_USERNAME}/backend:${IMAGE_TAG:-latest}
    container_name: geoflood-api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-geoflood}:${POSTGRES_PASSWORD:-geoflood_dev}@postgres:5432/${POSTGRES_DB:-geoflood}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      AI_SERVICE_URL: http://python-engine:8000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      python-engine:
        condition: service_started
    restart: always

  worker:
    image: ${DOCKERHUB_USERNAME}/backend:${IMAGE_TAG:-latest}
    container_name: geoflood-worker
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-geoflood}:${POSTGRES_PASSWORD:-geoflood_dev}@postgres:5432/${POSTGRES_DB:-geoflood}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
    command: node dist/worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  python-engine:
    image: ${DOCKERHUB_USERNAME}/python-engine:${IMAGE_TAG:-latest}
    container_name: geoflood-python
    environment:
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    restart: always

volumes:
  postgres_data:
  redis_data:
  minio_data:
